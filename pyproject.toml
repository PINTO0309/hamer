[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hamer"
version = "0.0.0"
description = "HaMeR as a package"
requires-python = "==3.10.12"
dependencies = [
    "gdown==6.1.0",
    "numpy==2.2.6",
    "opencv-python==4.13.0.92",
    "pyrender==0.1.45",
    "pytorch-lightning==2.3.3",
    "scikit-image==0.25.2",
    "setuptools==70.2.0",
    "smplx==0.1.28",
    "torch==2.11.0+cu128",
    "torchvision==0.26.0+cu128",
    "yacs==0.1.8",
    "detectron2==0.6",
    "chumpy==0.71",
    "mmcv==1.3.9",
    "timm==1.0.27",
    "einops==0.8.2",
    "xtcocotools==1.14.3",
    "pandas==2.3.3",
]

[project.optional-dependencies]
all = [
    "hydra-core==1.3.3",
    "hydra-submitit-launcher==1.2.0",
    "hydra-colorlog==1.2.0",
    "pyrootutils==1.0.4",
    "rich==15.0.0",
    "webdataset==1.0.2",
]

[tool.setuptools.packages.find]
include = ["hamer*"]

[tool.uv]
no-build-isolation-package = ["detectron2", "mmcv"]
dependency-metadata = [
    { name = "chumpy", version = "0.71", requires-dist = ["scipy", "six"] },
    { name = "detectron2", version = "0.6", requires-dist = ["black", "cloudpickle", "fvcore", "hydra-core", "iopath", "matplotlib", "omegaconf", "packaging", "pillow", "pycocotools", "tabulate", "tensorboard", "termcolor", "tqdm", "yacs"] },
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
detectron2 = { git = "https://github.com/facebookresearch/detectron2.git", rev = "02b5c4e295e990042a714712c21dc79b731e8833" }
chumpy = { git = "https://github.com/mattloper/chumpy.git", rev = "580566eafc9ac68b2614b64d6f7aaa84eebb70da" }

[tool.uv.extra-build-dependencies]
chumpy = ["pip"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
